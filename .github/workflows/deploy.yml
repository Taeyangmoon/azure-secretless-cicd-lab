name: Build and Deploy (secretless)

on:
  push:
    branches: [main]
    paths: ["app/**", "scripts/**", ".github/workflows/deploy.yml"]
  pull_request:
    branches: [main]
    paths: ["app/**", "scripts/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test app and setup script
        run: |
          npm --prefix app test
          node --test scripts/test/*.test.js

      - name: Write build info
        working-directory: app
        run: |
          cat > build-info.json <<EOF
          {
            "commit": "${GITHUB_SHA::7}",
            "runId": "${GITHUB_RUN_ID}",
            "actor": "${GITHUB_ACTOR}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app/

  deploy:
    # PR에서는 배포하지 않습니다 / No deployment on pull requests
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC 토큰 발급 허용 / allow requesting the OIDC token
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: app

      # 저장된 비밀 없음: ID 값은 비밀이 아니므로 Variables 사용
      # No stored secret: these IDs are not secrets, so we use Variables
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: app

      - name: Verify deployed app and build info
        timeout-minutes: 5
        env:
          WEBAPP_URL: ${{ steps.webapp.outputs.webapp-url }}
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const { setTimeout: delay } = require("node:timers/promises");

          async function verify() {
            for (let attempt = 1; attempt <= 12; attempt++) {
              try {
                const responses = await Promise.all(
                  ["/healthz", "/api/info", "/"].map((path) =>
                    fetch(new URL(path, process.env.WEBAPP_URL), {
                      signal: AbortSignal.timeout(10000),
                    })
                  )
                );
                for (const response of responses) {
                  assert.equal(response.status, 200, response.url);
                }
                assert.equal(await responses[0].text(), "ok");
                const info = await responses[1].json();
                assert.equal(info.commit, process.env.GITHUB_SHA.slice(0, 7));
                assert.equal(info.runId, process.env.GITHUB_RUN_ID);
                const html = await responses[2].text();
                assert.ok(html.includes(info.commit) && html.includes(info.runId));
                console.log(`Verified ${process.env.WEBAPP_URL}: commit ${info.commit}, run ${info.runId}`);
                return;
              } catch (error) {
                console.error(`Attempt ${attempt}/12: ${error.message}`);
                if (attempt === 12) throw error;
                await delay(10000);
              }
            }
          }
          verify().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
